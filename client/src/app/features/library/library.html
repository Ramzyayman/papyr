<div class="library-page">

  <div class="container">

    <!-- Page heading -->

    <section class="library-intro">

      <h1>Your Private Library</h1>

      <p>
        A quiet space dedicated to your current journeys and future adventures.
        <br>
        Organized, calm, and waiting for you.
      </p>

    </section>


    <!-- Want to Read -->

    <section class="library-section">

      <div class="section-heading">

        <h2>Want to Read</h2>

        <div class="heading-line"></div>

        <a
          routerLink="/library"
          class="view-all"
        >
          View all
          <span>→</span>
        </a>

      </div>


      <!-- Books -->

      <div class="library-grid">

        @for (
          book of books;
          track $index
        ) {

          <a
            [routerLink]="['/books', book.id]"
            class="library-book"
          >

            <div class="book-cover">

              <img
                [src]="book.cover"
                [alt]="book.title + ' cover'"
              />

            </div>

            <h3>
              {{ book.title }}
            </h3>

            <p>
              {{ book.author }}
            </p>

          </a>

        }


        <!-- Add Book -->

        <a
          routerLink="/catalog"
          class="add-book"
        >

          <span class="add-icon">+</span>

          <span>Add Book</span>

        </a>

      </div>

    </section>

  </div>

</div>
