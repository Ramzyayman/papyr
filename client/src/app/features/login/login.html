<div class="login-page">


  <!-- Left side -->

  <section class="welcome-panel">

    <div class="welcome-content">

      <h1>
        Welcome Back !
      </h1>

      <p>
        To keep connected with us please sign
        <br>
        up with your personal info
      </p>

    </div>


    <div class="shape shape-one"></div>

    <div class="shape shape-two"></div>

    <div class="shape shape-three"></div>


  </section>



  <!-- Right side -->

  <section class="login-panel">


    <div class="login-container">


      <h2>
        Log in
      </h2>


      <form
        (ngSubmit)="login()"
      >


        <!-- Email -->

        <div class="form-group">

          <label>
            Email
          </label>

          <input
            type="email"
            placeholder="Enter your email address"
            [(ngModel)]="email"
            name="email"
          />

        </div>



        <!-- Password -->

        <div class="form-group">

          <label>
            Password
          </label>

          <input
            type="password"
            placeholder="Enter your password"
            [(ngModel)]="password"
            name="password"
          />

        </div>



        <!-- Remember -->

        <div class="remember">

          <input
            type="checkbox"
            [(ngModel)]="rememberMe"
            name="rememberMe"
          />

          <label>
            Remember me
          </label>

        </div>



        <button
          type="submit"
        >
          Log in
        </button>


      </form>


    </div>


  </section>


</div>
